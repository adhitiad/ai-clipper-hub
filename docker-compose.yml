version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: clipper_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: clipper_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
